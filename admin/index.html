<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14162E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="okpublisher">
<title>Διαχείριση · okpublisher</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../img/favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="../fonts/fonts.css">
<!--
  Διαχειριστικό του okpublisher. Τα δεδομένα τα δίνει το Apps Script «okpublisher» (publisher/Admin.gs στο repo
  okpublisher/publisher) μόνο μετά από σύνδεση με κωδικό στο email. Εδώ δεν υπάρχει κανένα δεδομένο ή κλειδί.
-->
<style>
:root{--v:#5B21D6;--y:#FFD23F;--d:#14162E;--l:#F2ECFF;--g:#4A4C66;--r:#C62828;--ok:#1B7F3B;--line:#E4DDF5}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 Manrope,system-ui,sans-serif;color:var(--d);background:var(--l);-webkit-text-size-adjust:100%}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));background:var(--d);color:#fff;position:sticky;top:0;z-index:2}
.brand{font:800 19px "M PLUS Rounded 1c",Manrope,sans-serif}.brand b{color:var(--y)}.brand span{font:500 13px Manrope,sans-serif;opacity:.75;margin-left:6px}
#who{font-size:12px;opacity:.9;text-align:right}#who a{color:var(--y)}
nav:empty{display:none}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:1;scrollbar-width:none}
nav button{flex:0 0 auto;border:1.5px solid var(--v);background:#fff;color:var(--v);border-radius:999px;padding:6px 13px;font:700 14px Manrope,sans-serif}
nav button.on{background:var(--v);color:#fff}nav button i{font-style:normal;background:var(--y);color:var(--d);border-radius:9px;padding:0 6px;margin-left:5px;font-size:12px}
main{max-width:760px;margin:0 auto;padding:12px 12px 40px}
.card{background:#fff;border-radius:16px;padding:13px 15px;margin:0 0 10px;box-shadow:0 1px 2px rgba(20,22,46,.06)}
.card h3{margin:0 0 2px;font:800 16px/1.3 "M PLUS Rounded 1c",Manrope,sans-serif}
.row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.muted{color:var(--g);font-size:13px}
.tag{white-space:nowrap;display:inline-block;font-size:12px;border-radius:8px;padding:1px 7px;margin:2px 4px 2px 0;background:var(--l);color:var(--v);font-weight:700}
.tag.y{background:#FFF6CC;color:#7a5b00}.tag.r{background:#fde7e7;color:var(--r)}.tag.ok{background:#e3f4e8;color:var(--ok)}
h2{font:800 13px Manrope,sans-serif;margin:18px 4px 8px;color:var(--g);text-transform:uppercase;letter-spacing:.05em}
a{color:var(--v)}
details summary{cursor:pointer;color:var(--v);font-size:13px;margin-top:4px}
.facts{margin:8px 0 4px;background:#FAF8FF;border-radius:12px;padding:6px 10px}.facts div{display:flex;gap:10px;font-size:13px;padding:3px 0;line-height:1.35}
.facts b{flex:0 0 82px;color:var(--g);font-weight:700}.facts .ok{color:var(--ok);font-weight:700}.facts .r{color:var(--r);font-weight:700}.facts .y{color:#7a5b00;font-weight:700}
.mylink{font:700 15px Manrope,sans-serif;background:var(--l);border-radius:10px;padding:8px 10px;word-break:break-all;margin:6px 0}
.qr{text-align:center;margin:8px 0}.qr svg{width:220px;height:220px}.r2{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sf{display:flex;gap:8px}.sf .search{flex:1}.sf select{width:auto;max-width:45%;margin:0 0 10px}
.kv{font-size:13px;margin:6px 0 0}.kv div{margin:2px 0}.kv b{color:var(--g);font-weight:700}
input,select{font:16px Manrope,sans-serif;padding:11px 12px;border:1.5px solid #d6ccef;border-radius:12px;width:100%;background:#fff;color:var(--d)}
.btn{font:800 16px Manrope,sans-serif;background:var(--v);color:#fff;border:0;border-radius:999px;padding:12px 22px;cursor:pointer;width:100%}
.btn.s{width:auto;background:#fff;color:var(--v);border:1.5px solid var(--v);padding:6px 12px;font-size:13px}.btn:disabled{opacity:.55}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:6px}.stat .card{margin:0;text-align:center}
.stat b{display:block;font:800 28px "M PLUS Rounded 1c",Manrope,sans-serif;color:var(--v)}
.err{background:#fde7e7;color:var(--r);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.search{margin:0 0 10px}.login{max-width:420px;margin:32px auto}.login p{margin:0 0 12px}.grid2{display:grid;gap:10px}
.pin{font:800 28px "M PLUS Rounded 1c",Manrope,sans-serif;letter-spacing:8px;text-align:center}
.ok-msg{background:#e3f4e8;color:var(--ok);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.act{margin-top:8px;border-top:1px solid var(--line);padding-top:6px}.act .r2{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.act select{padding:8px 10px;font-size:14px;flex:1 1 130px;width:auto}
.act .btn.s{white-space:nowrap}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.link{background:none;border:0;color:var(--v);font:600 14px Manrope,sans-serif;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<header><div class="brand">ok<b>publisher</b> <span>Διαχείριση</span></div><div id="who"></div></header>
<nav id="tabs"></nav>
<main id="main"><p class="muted">Μια στιγμή…</p></main>
<script src="qrcode.min.js"></script>
<script>
// Η διεύθυνση του Apps Script (web app). Τα δεδομένα δίνονται μόνο μετά από σύνδεση.
var API = 'https://script.google.com/macros/s/AKfycby0Y9ODJM97SqPltW2Ig07dYkwZihrwON18KhSL_EgL2lRsiE4PPfMXweZXMWMEFoyN/exec';
(function () {
  var S = null, D = null, TAB = 'today', Q = '', LINK = '', NOTE = '', SF = '';
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { /* χωρίς αποθήκευση */ } }
  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function api(o) {
    o.a = 'admin';
    return fetch(API, { method: 'POST', body: JSON.stringify(o), redirect: 'follow' }).then(function (r) { return r.json(); });
  }
  // act + στοιχεία → ok(r) ή fail(μήνυμα). Χωρίς συνεδρία → ξανά σύνδεση.
  function call(act, o, ok, fail) {
    o = o || {}; o.act = act; if (S) o.token = S;
    api(o).then(function (r) {
      if (r.ok) return ok(r);
      if (r.login) { S = null; D = null; store('okp_admin', null); if (LINK) { var c = LINK; LINK = ''; showLink(c); } else showLogin(r.error); return; }
      (fail || flash)(r.error || 'Κάτι πήγε στραβά.');
    }).catch(function () { (fail || flash)('Δεν υπάρχει σύνδεση με τον server. Δοκιμάστε ξανά.'); });
  }
  function flash(m) { var f = $('flash'); if (!f) { f = document.createElement('div'); f.id = 'flash'; f.className = 'err'; $('main').insertBefore(f, $('main').firstChild); } f.textContent = m; window.scrollTo(0, 0); }
  function flashOk(m) { var f = $('flash'); if (f) f.parentNode.removeChild(f); f = document.createElement('div'); f.id = 'flash'; f.className = 'ok-msg'; f.textContent = m; $('main').insertBefore(f, $('main').firstChild); window.scrollTo(0, 0); }
  function fallbackCopy(t) { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) { /* τίποτα */ } document.body.removeChild(a); }
  // Σύνδεσμος πωλητή: αντιγραφή, αποστολή, QR (id = μοναδικό για το κουτί του QR).
  function linkBox(url, id) {
    return '<div class="mylink">' + esc(url) + '</div><div class="r2"><button class="btn s" data-copy="' + esc(url) + '">Αντιγραφή</button>' +
      (navigator.share ? '<button class="btn s" data-share="' + esc(url) + '">Αποστολή…</button>' : '') +
      '<button class="btn s" data-qr="' + id + '">QR</button></div><div class="qr" id="' + id + '" data-url="' + esc(url) + '" hidden></div>';
  }
  function myLink() {
    var m = D.me;
    if (!m.link) return '';
    return '<h2>Ο σύνδεσμός σου</h2><div class="card"><div class="muted">Στείλε τον στον πελάτη ή δείξε του το QR. Όποιος συμπληρώσει τη φόρμα από αυτόν είναι δικός σου, για πάντα.</div>' +
      linkBox(m.link, 'qr-me') + '<details><summary>Σύνδεσμος κατευθείαν για σετάρισμα</summary>' + linkBox(m.setup_link, 'qr-me2') + '</details>' +
      (m.pct ? '<div class="kv"><b>Προμήθεια:</b> ' + m.pct + '% στο καθαρό ποσό (χωρίς ΦΠΑ) κάθε πληρωμής των πελατών σου.</div>' : '') + '</div>';
  }
  function commSum(L) { return L.reduce(function (a, x) { return a + (x.amount || 0); }, 0); }
  // Προμήθειες του πωλητή, ανά μήνα.
  function vComm() {
    var C = D.commissions || [], by = {};
    C.forEach(function (x) { (by[x.month] = by[x.month] || []).push(x); });
    var h = '<div class="card">' + (D.me.pct ? '<b>Ποσοστό:</b> ' + D.me.pct + '% στο καθαρό ποσό (χωρίς ΦΠΑ) κάθε πληρωμής των πελατών σου.' : 'Δεν έχει οριστεί ποσοστό ακόμα.') + '</div>';
    var M = Object.keys(by).sort().reverse();
    if (!M.length) return h + '<div class="card muted">Καμία πληρωμή πελάτη σου ακόμα.</div>';
    return h + M.map(function (m) {
      return '<h2>' + months(m) + ' · ' + eur(commSum(by[m])) + '</h2>' + by[m].map(function (x) {
        return '<div class="card"><div class="row"><b>' + esc((x.code ? x.code + ' · ' : '') + x.client_name) + '</b><b>' + eur(x.amount) + '</b></div>' +
          '<div class="muted">' + esc(x.pay || '') + ' · καθαρό ' + eur(x.net) + ' × ' + x.pct + '%</div></div>';
      }).join('');
    }).join('');
  }
  function ymNow() { return new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Athens' }).slice(0, 7); }
  function ymAdd(ym, n) { var p = ym.split('-').map(Number), t = p[0] * 12 + p[1] - 1 + n; return Math.floor(t / 12) + '-' + ('0' + (t % 12 + 1)).slice(-2); }
  function paying(c) { var b = c.billing; return !!(b && b.card && !b.offer && !(b.stop_after && b.stop_after < ymNow())); }
  // Ημερομηνία «2027-01-27» → «27/1/2027»· περίοδος/μήνας με την ετικέτα που στέλνει το script (ή τον μήνα).
  function dmy(s) { var p = String(s || '').split('-'); return p.length === 3 ? (+p[2]) + '/' + (+p[1]) + '/' + p[0] : ''; }
  function per(b, ym) { return b && b.day > 1 ? (b.months.filter(function (x) { return x.month === ym; })[0] || {}).label || months(ym) : months(ym); }
  function athens(iso, withTime) {
    if (!iso || !/^\d{4}-/.test(iso)) return esc(iso || '');
    var o = { timeZone: 'Europe/Athens', weekday: 'short', day: 'numeric', month: 'numeric' };
    if (withTime !== false) { o.hour = '2-digit'; o.minute = '2-digit'; }
    return esc(new Date(iso).toLocaleString('el-GR', o));
  }
  function dayKey(iso) { return new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Europe/Athens' }); }
  function months(ym) { if (!ym) return ''; var p = ym.split('-'); return ['Ιαν', 'Φεβ', 'Μαρ', 'Απρ', 'Μάι', 'Ιουν', 'Ιουλ', 'Αυγ', 'Σεπ', 'Οκτ', 'Νοε', 'Δεκ'][+p[1] - 1] + ' ' + p[0]; }
  function eur(n) { return '€' + Number(n || 0).toFixed(2).replace('.', ','); }
  function tag(t, c) { return t ? '<span class="tag ' + (c || '') + '">' + esc(t) + '</span>' : ''; }
  function kv(pairs) { return '<div class="kv">' + pairs.filter(function (p) { return p[1]; }).map(function (p) { return '<div><b>' + esc(p[0]) + ':</b> ' + p[1] + '</div>'; }).join('') + '</div>'; }
  function mail(e) { return e ? '<a href="mailto:' + esc(e) + '">' + esc(e) + '</a>' : ''; }
  function tel(p) { return p ? '<a href="tel:' + esc(String(p).replace(/[^\d+]/g, '')) + '">' + esc(p) + '</a>' : ''; }
  function link(u, t) { return u && /^https:\/\//.test(u) ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t || 'άνοιγμα') + '</a>' : ''; }
  function isNew(s) { return /^νέο$/i.test(String(s || '').trim()); }
  function bad(s) { return /Σφάλμα|Δεν δημοσιεύτηκε/.test(s || ''); }
  function hit(o) { return !Q || JSON.stringify(o).toLowerCase().indexOf(Q) >= 0; }
  function clientOf(K) { return (D.clients || []).filter(function (c) { return c.key === K; })[0]; }
  function cname(K) { var c = clientOf(K); return c ? (c.code ? c.code + ' · ' : '') + c.name : K; }
  var PK = { queued: 'στην ουρά', sending: 'στέλνεται για ΟΚ', sent: 'περιμένει ΟΚ', approved: 'εγκρίθηκε', changes: 'ζητήθηκαν αλλαγές',
    changes_requested: 'ζητήθηκαν αλλαγές', published: 'δημοσιεύτηκε', done: 'ολοκληρώθηκε' };

  // ------------------------------------------------------------------ σύνδεση
  function showLogin(msg) {
    $('tabs').innerHTML = ''; $('who').innerHTML = '';
    var em = load('okp_admin_email') || '';
    $('main').innerHTML = '<div class="card login"><h3>Σύνδεση</h3><p class="muted">Γράψτε το email σας. Αν έχει πρόσβαση, θα σας έρθει κωδικός.</p>' +
      '<div class="grid2"><input id="em" type="email" autocomplete="email" inputmode="email" placeholder="email" value="' + esc(em) + '">' +
      '<button class="btn" id="go">Στείλε μου κωδικό</button></div>' +
      (em ? '<p style="margin:14px 0 0"><button class="link" id="have">Έχω ήδη κωδικό</button></p>' : '') +
      '<p id="lm" class="muted" style="margin-top:12px">' + esc(msg || '') + '</p></div>';
    $('go').onclick = function () {
      var b = this, e = $('em').value.trim();
      if (!e) return;
      b.disabled = true; store('okp_admin_email', e);
      call('login', { email: e }, function () { showPin(); }, function (m) { $('lm').textContent = m; b.disabled = false; });
    };
    if ($('have')) $('have').onclick = function () { showPin(); };
  }
  function showPin(msg) {
    var em = load('okp_admin_email') || '';
    $('main').innerHTML = '<div class="card login"><h3>Κωδικός</h3><p class="muted">Γράψτε τον 6ψήφιο κωδικό που στάλθηκε στο <b>' + esc(em) + '</b>. ' +
      'Ισχύει 15 λεπτά. (Ή πατήστε τον σύνδεσμο του email.)</p>' +
      '<div class="grid2"><input id="pin" class="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="••••••">' +
      '<button class="btn" id="go">Σύνδεση</button></div>' +
      '<p style="margin:14px 0 0"><button class="link" id="back">Άλλο email ή νέος κωδικός</button></p>' +
      '<p id="lm" class="muted" style="margin-top:12px">' + esc(msg || '') + '</p></div>';
    $('pin').focus();
    $('go').onclick = function () {
      var b = this; b.disabled = true;
      call('pin', { email: em, pin: $('pin').value }, loggedIn, function (m) { $('lm').textContent = m; b.disabled = false; });
    };
    $('pin').onkeydown = function (e) { if (e.key === 'Enter') $('go').click(); };
    $('back').onclick = function () { showLogin(); };
  }
  function showLink(code) {
    $('main').innerHTML = '<div class="card login"><h3>Σύνδεση στο διαχειριστικό</h3><p class="muted">Πατήστε για να συνδεθείτε σε αυτή τη συσκευή (30 ημέρες).</p>' +
      '<button class="btn" id="go">Σύνδεση</button><p id="lm" class="muted" style="margin-top:12px"></p></div>';
    $('go').onclick = function () {
      var b = this; b.disabled = true;
      call('link', { code: code }, loggedIn, function (m) { showLogin(m); });
    };
  }
  function loggedIn(r) { S = r.token; store('okp_admin', S); refresh(); }
  // Νέα έκδοση της σελίδας; Η εφαρμογή στην αρχική οθόνη κρατά την παλιά στη μνήμη.
  // Ρωτάμε τον server πότε άλλαξε η σελίδα· αν είναι νεότερη από αυτήν που τρέχει, τη φορτώνουμε ξανά.
  var VCHK = 0;
  function newVersion(then) {
    var mine = Date.parse(document.lastModified), done = false;
    function go(v) { if (!done) { done = true; then(v); } }
    if (!window.fetch || !mine) return go(0);
    setTimeout(function () { go(0); }, 4000);
    fetch(location.pathname + '?v=' + Date.now(), { method: 'HEAD', cache: 'no-store' }).then(function (r) {
      var lm = Date.parse(r.headers.get('last-modified') || '');
      go(r.ok && lm && lm > mine + 2000 && load('okp_admin_rl') !== String(lm) ? lm : 0);
    }).catch(function () { go(0); });
  }
  function reloadIfNew(otherwise) {
    VCHK = Date.now();
    newVersion(function (lm) {
      if (!lm) { if (otherwise) otherwise(); return; }
      store('okp_admin_rl', String(lm)); store('okp_admin_tab', TAB);   // μία φορά ανά έκδοση· ίδια καρτέλα μετά
      location.replace(location.pathname + '?v=' + lm);
    });
  }
  function refresh() {
    if (!D) $('main').innerHTML = '<p class="muted">Φόρτωση…</p>';
    call('data', {}, function (r) { D = r.data; render(); if (NOTE) { flashOk(NOTE); NOTE = ''; } }, function (m) { $('main').innerHTML = '<div class="err">' + esc(m) + '</div>'; });
  }
  function logout() { call('logout', {}, function () {}, function () {}); S = null; D = null; store('okp_admin', null); showLogin(); }

  // ------------------------------------------------------------------ καρτέλες
  function tabsList() {
    var t = [['today', 'Σήμερα'], ['leads', 'Επαφές', D.leads.filter(function (l) { return isNew(l.status); }).length],
      ['setups', 'Σεταρίσματα', D.setups.filter(function (s) { return isNew(s.status); }).length], ['clients', 'Πελάτες'], ['posts', 'Δημοσιεύσεις']];
    if (D.me.role === 'admin') t.push(['pay', 'Πληρωμές'], ['users', 'Χρήστες']); else t.push(['comm', 'Προμήθειες']);
    return t;
  }
  function render() {
    $('who').innerHTML = esc(D.me.name || D.me.email) + ' · ' + (D.me.role === 'admin' ? 'Διαχειριστής' : 'Πωλητής') +
      '<br><a href="#" id="rf">ανανέωση</a> · <a href="#" id="lo">έξοδος</a>';
    $('rf').onclick = function (e) { e.preventDefault(); reloadIfNew(refresh); };
    $('lo').onclick = function (e) { e.preventDefault(); logout(); };
    $('tabs').innerHTML = tabsList().map(function (t) { return '<button data-t="' + t[0] + '" class="' + (t[0] === TAB ? 'on' : '') + '">' + t[1] + (t[2] ? '<i>' + t[2] + '</i>' : '') + '</button>'; }).join('');
    Array.prototype.forEach.call($('tabs').querySelectorAll('button'), function (b) { b.onclick = function () { TAB = b.getAttribute('data-t'); Q = ''; render(); window.scrollTo(0, 0); }; });
    var errs = (D.errors || []).map(function (e) { return '<div class="err">' + esc(e) + '</div>'; }).join('');
    var V = { today: vToday, leads: vLeads, setups: vSetups, clients: vClients, posts: vPosts, pay: vPay, users: vUsers, comm: vComm }[TAB] || vToday;
    $('main').innerHTML = errs + V();
    var s = $('q');
    if (s) { s.value = Q; s.oninput = function () { Q = s.value.trim().toLowerCase(); var p = s.selectionStart; render(); var n = $('q'); n.focus(); n.setSelectionRange(p, p); }; }
    var sf = $('sf');
    if (sf) { sf.value = SF; sf.onchange = function () { SF = sf.value; render(); }; }
    bind();
  }
  function search(ph, withSeller) {
    var q = '<input id="q" class="search" type="search" placeholder="' + esc(ph) + '">';
    if (!withSeller || D.me.role !== 'admin' || !D.sellers.length) return q;
    return '<div class="sf">' + q + '<select id="sf"><option value="">Όλοι</option><option value="-">Χωρίς πωλητή</option>' +
      D.sellers.map(function (x) { return '<option value="' + esc(x.email) + '">' + esc(x.name || x.email) + '</option>'; }).join('') + '</select></div>';
  }
  // Φίλτρο πωλητή (διαχειριστής): όλοι / χωρίς πωλητή / ένας πωλητής.
  function bySeller(o) { return !SF || (SF === '-' ? !o.seller : o.seller === SF); }
  // «Πηγή»: από ποιον σύνδεσμο ήρθε ή ποιος τον ανέθεσε. Η απόδειξη ότι ο πελάτης ανήκει σε πωλητή.
  function srcText(o) {

      h += '<div class="kv"><b>Δωρεάν</b></div><div class="r2">' + mo('fu-' + k, cur, 13, '<option value="">χωρίς λήξη</option>') + btn('client_free', 'Δωρεάν') + '</div>';
      if (c.has_email) h += '<div class="kv"><b>Χρέωση</b> (email με σύνδεσμο πληρωμής· ξεκινά τη μέρα που θα πληρώσει, και τότε γίνεται αμέσως η παραγωγή)</div>' +
        (b && b.offer && !b.offer.closed ? '<div class="kv muted">Σε αναμονή: ' + (b.offer.kind === 'charge' ? 'σύνδεσμος για ' : '«Συνεχίζουμε;» μετά τη δωρεάν εβδομάδα, διάλεξε ') +
          esc(b.offer.chosen) + ' (μέρα ' + b.offer.day + '/14). Νέα αποστολή = νέος σύνδεσμος.</div>' : '') +
        '<div class="r2">' + plans('cp-' + k, (b && b.offer && b.offer.chosen) || c.package || 'Βασικό') + btn('client_charge', 'Αποστολή') + '</div>' +
        '<div class="kv" id="cw-' + k + '" style="color:var(--r);font-weight:700"></div>';
      else h += '<div class="kv muted">Για χρέωση χρειάζεται email πελάτη (NOTIFY_TO).</div>';
    } else if (!b.stop_after) {
      h += '<div class="kv"><b>Συνδρομή</b></div><div class="r2">' + btn('client_stop', 'Διακοπή συνδρομής') + '</div>';
    }
    h += '<div class="kv"><b>Έγκριση προγράμματος</b> (από την επόμενη παραγωγή)</div><div class="r2"><select id="ap-' + k + '"><option value="email"' + (c.no_approval ? '' : ' selected') +
      '>Με email (ΟΚ)</option><option value="none"' + (c.no_approval ? ' selected' : '') + '>Χωρίς έγκριση (μόνο ενημέρωση)</option></select>' + btn('client_approval', 'Αλλαγή') + '</div>';
    return h + '</details>';
  }
  // Κόκκινη προειδοποίηση για δωρεάν πελάτη: με την πληρωμή τα δωρεάν σταματούν.
  function chargeWarn(K) {
    var c = clientOf(K), w = $('cw-' + K);
    if (!c || !w) return '';
    var t = c.free && !(c.free.until && c.free.until < ymNow())
      ? 'Είναι δωρεάν' + (c.free.until ? ' έως ' + months(c.free.until) : ' χωρίς λήξη') + '. Με την πληρωμή τα δωρεάν σταματούν και ξεκινά η συνδρομή.' : '';
    w.textContent = t;
    return t;
  }
  function vClients() { var L = (D.clients || []).filter(hit).filter(bySeller); return search('Αναζήτηση σε πελάτες…', 1) + (L.length ? L.map(clientCard).join('') : '<div class="card muted">Κανένας πελάτης.</div>'); }
  function postCard(p) {
    var cls = function (s) { return bad(s) ? 'r' : (/Δημοσιεύτηκε/.test(s) ? 'ok' : ''); };
    return '<div class="card"><div class="row"><b>' + athens(p.at) + '</b><span class="muted">' + esc(p.type) + '</span></div><div class="muted">' + esc(cname(p.client)) + '</div>' +
      (p.caption ? '<div style="font-size:13px;margin:4px 0">' + esc(p.caption) + '…</div>' : '') +
      tag('IG: ' + (p.ig || '—'), cls(p.ig)) + tag('FB: ' + (p.fb || '—'), cls(p.fb)) +
      (linkBtn(p.ig_link, 'Instagram') + linkBtn(p.fb_link, 'Facebook') ? '<div class="r2">' + linkBtn(p.ig_link, 'Instagram') + linkBtn(p.fb_link, 'Facebook') + '</div>' : '') + '</div>';
  }
  // Φίλτρο πωλητή για δημοσιεύσεις (ο πωλητής του πελάτη).
  function bySellerC(o) { var c = clientOf(o.client); return bySeller({ seller: c ? c.seller : '' }); }
  function linkBtn(u, t) { return u && /^https:\/\//.test(u) ? '<a class="btn s" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t) + '</a>' : ''; }
  // «Δημοσιεύτηκαν»: μία κάρτα ανά δημοσίευση, με κουμπιά που ανοίγουν την ανάρτηση.
  function pubCard(p) {
    var st = function (x) { return x ? x.status : '—'; }, cls = function (x) { return !x ? '' : /Δημοσιεύτηκε/.test(x.status) ? 'ok' : /Σφάλμα|Δεν δημοσιεύτηκε/.test(x.status) ? 'r' : ''; };
    var b = linkBtn(p.ig && p.ig.link, 'Instagram') + linkBtn(p.fb && p.fb.link, 'Facebook');
    return '<div class="card"><div class="row"><b>' + athens(p.at) + '</b><span class="muted">' + esc(p.type) + '</span></div><div class="muted">' + esc(cname(p.client)) + '</div>' +
      (p.caption ? '<div style="font-size:13px;margin:4px 0">' + esc(p.caption) + '…</div>' : '') +
      tag('IG: ' + st(p.ig), cls(p.ig)) + tag('FB: ' + st(p.fb), cls(p.fb)) + (b ? '<div class="r2">' + b + '</div>' : '') + '</div>';
  }
  function vPosts() {
    var now = Date.now();
    // Επόμενες: ό,τι δεν έχει έρθει η ώρα του, και ό,τι πέρασε (έως 6 ώρες) αλλά περιμένει ή έχει σφάλμα. Τα δημοσιευμένα → «Δημοσιεύτηκαν».
    var pending = function (p) { return /Σε αναμονή|Σφάλμα/.test((p.ig || '') + ' ' + (p.fb || '')); };
    var up = (D.queue || []).filter(function (p) { var t = new Date(p.at).getTime(); return t > now || (t > now - 6 * 3600000 && pending(p)); })
      .filter(hit).filter(bySellerC).slice(0, 60);
    var pub = (D.published || []).filter(hit).filter(bySellerC);
    var pr = (D.problems || []).filter(hit).filter(bySellerC).slice(0, 40);
    return search('Αναζήτηση…', 1) + '<h2>Επόμενες</h2>' + (up.length ? up.map(postCard).join('') : '<div class="card muted">Η ουρά είναι άδεια.</div>') +
      '<h2>Δημοσιεύτηκαν · 30 ημέρες</h2>' + (pub.length ? pub.map(pubCard).join('') : '<div class="card muted">Τίποτα ακόμα.</div>') +
      (pr.length ? '<h2>Σφάλματα · 30 ημέρες</h2>' + pr.map(function (r) {
        return '<div class="card"><div class="row"><b>' + athens(r.at) + '</b>' + tag(r.status, 'r') + '</div>' +
          '<div class="muted">' + esc(cname(r.client)) + ' · ' + esc(r.type) + ' · ' + esc(r.id) + '</div>' + (r.detail ? '<div style="font-size:13px">' + esc(r.detail) + '</div>' : '') + '</div>';
      }).join('') : '');
  }
  function vPay() {
    var P = (D.payments || []).filter(function (p) { return p.pay; }).filter(hit);
    var h = search('Αναζήτηση σε πληρωμές…') + '<h2>Πληρωμές</h2>' + (P.length ? P.map(function (p) {
      return '<div class="card"><div class="row"><h3>' + esc(p.pay) + '</h3><b>' + eur(p.amount) + '</b></div>' +
        '<div>' + esc((p.code ? p.code + ' · ' : '') + (p.name || cname(p.client))) + '</div>' +
        kv([['Πακέτο', esc(p.plan)], ['Μήνας', esc(/^\d{4}-\d{2}$/.test(p.month) ? months(p.month) : p.month)], ['Πότε', athens(p.at)], ['Τρόπος', esc(p.action)]]) + '</div>';
    }).join('') : '<div class="card muted">Καμία πληρωμή ακόμα.</div>');
    var K = D.commissions || [], bm = {};
    K.forEach(function (x) { var k = x.month; bm[k] = bm[k] || {}; (bm[k][x.seller_name] = bm[k][x.seller_name] || []).push(x); });
    var KM = Object.keys(bm).sort().reverse();
    if (KM.length) h += '<h2>Προμήθειες πωλητών</h2>' + KM.slice(0, 12).map(function (m) {
      return '<div class="card"><h3>' + months(m) + '</h3>' + Object.keys(bm[m]).sort().map(function (n) {
        var L = bm[m][n];
        return '<details><summary><b>' + esc(n) + '</b>: ' + eur(commSum(L)) + ' (' + L.length + (L.length === 1 ? ' πληρωμή' : ' πληρωμές') + ')</summary>' +
          L.map(function (x) { return '<div class="kv">' + esc((x.code ? x.code + ' · ' : '') + x.client_name) + ' · ' + esc(x.pay) + ' · καθαρό ' + eur(x.net) + ' × ' + x.pct + '% = <b>' + eur(x.amount) + '</b></div>'; }).join('') + '</details>';
      }).join('') + '</div>';
    }).join('');
    var C = (D.clients || []).filter(function (c) { return c.billing && !c.billing.offer; });
    h += '<h2>Συνδρομές</h2>' + (C.length ? C.map(function (c) {
      var b = c.billing;
      return '<div class="card"><div class="row"><h3>' + esc(cname(c.key)) + '</h3>' + (b.unpaid.length && b.card ? tag('απλήρωτο', 'r') : tag(b.card ? 'κάρτα ✓' : 'χωρίς κάρτα', b.card ? 'ok' : 'y')) + '</div>' +
        kv([['Πακέτο', esc(b.plan) + ' · ' + eur(b.amount_eur) + '/μήνα' + (b.day > 1 ? ' · χρέωση στις ' + b.day : '')], ['Επόμενη χρέωση', b.next ? (b.day > 1 ? dmy(b.next_date) : months(b.next)) : 'καμία'],
          ['Λήξη μετά', b.stop_after ? (b.stop_label || months(b.stop_after)) : ''], ['Αλλαγή πακέτου', b.change ? esc(b.change.plan) + ' από ' + (b.change.from_label || months(b.change.from)) : '']]) + '</div>';
    }).join('') : '<div class="card muted">Καμία συνδρομή ακόμα.</div>');
    var R = (D.payments || []).filter(function (p) { return !p.pay; }).filter(hit).slice(0, 80);
    h += '<details><summary>Άλλες κινήσεις (σύνδεσμοι, υπενθυμίσεις, λύσεις) · ' + R.length + '</summary>' + R.map(function (p) {
      return '<div class="card"><div class="row"><b>' + esc(cname(p.client)) + '</b><span class="muted">' + athens(p.at) + '</span></div>' +
        '<div>' + esc(p.action) + (p.amount !== '' ? ' · ' + eur(p.amount) : '') + (p.month ? ' · ' + esc(/^\d{4}-\d{2}$/.test(p.month) ? months(p.month) : p.month) : '') + '</div>' +
        '<div class="muted">' + esc(p.result) + '</div></div>';
    }).join('') + '</details>';
    return h;
  }
  function vUsers() {
    var h = (D.users || []).map(function (u, i) {
      var cnt = function (L) { return (L || []).filter(function (x) { return x.seller === u.email; }).length; };
      var sales = u.role === 'sales' ? '<div class="kv"><b>Δικοί του:</b> ' + cnt(D.clients) + ' πελάτες · ' + cnt(D.setups) + ' σεταρίσματα · ' + cnt(D.leads) + ' επαφές</div>' +
        (u.link ? '<div class="kv"><b>Σύνδεσμος:</b></div>' + linkBox(u.link, 'qr-u' + i) : '') +
        '<div class="kv"><b>Προμήθεια:</b> ' + (u.has_pct ? u.pct + '%' : 'δεν έχει οριστεί') + '</div><div class="r2"><input id="pc-' + i + '" inputmode="decimal" placeholder="%" value="' +
        (u.has_pct ? u.pct : '') + '" style="width:90px"><button class="btn s" data-savepct="' + esc(u.email) + '" data-i="' + i + '">Αποθήκευση %</button></div>' +
        '<div class="muted">Στο καθαρό ποσό (χωρίς ΦΠΑ) κάθε πληρωμής των πελατών του. Αλλαγή: ισχύει από αυτόν τον μήνα.</div>' : '';
      return '<div class="card"><div class="row"><h3>' + esc(u.name || u.email) + '</h3>' + tag(u.role === 'admin' ? 'Διαχειριστής' : 'Πωλητής', u.role === 'admin' ? '' : 'y') + '</div>' +
        '<div class="muted">' + esc(u.email) + (u.owner ? ' · λογαριασμός okpublisher (πάντα διαχειριστής)' : '') + '</div>' + sales +
        (!u.owner && u.email !== D.me.email ? '<p style="margin:8px 0 0"><button class="btn s" data-deluser="' + esc(u.email) + '">Αφαίρεση</button></p>' : '') + '</div>';
    }).join('');
    h += '<h2>Νέος χρήστης ή αλλαγή ρόλου</h2><div class="card grid2"><input id="ue" type="email" placeholder="email"><input id="un" placeholder="όνομα">' +
      '<select id="ur"><option value="sales">Πωλητής: μόνο τους δικούς του</option><option value="admin">Διαχειριστής: τα πάντα</option></select>' +
      '<input id="up" inputmode="decimal" placeholder="προμήθεια % (για πωλητή)">' +
      '<button class="btn" id="addu">Αποθήκευση</button><p class="muted" style="margin:0">Ο νέος χρήστης παίρνει email με τη διεύθυνση (ο πωλητής και τον σύνδεσμό του). Μπαίνει με κωδικό στο email του.</p></div>';
    return h;
  }

  // ------------------------------------------------------------------ έναρξη
  var m = /[#&]t=([a-f0-9]{40,80})/.exec(location.hash);
  if (location.hash || location.search) history.replaceState(null, '', location.pathname);   // ο κωδικός (και το ?v=) δεν μένει στη διεύθυνση
  S = load('okp_admin');
  LINK = m ? m[1] : '';
  var t0 = load('okp_admin_tab'); if (t0) { TAB = t0; store('okp_admin_tab', null); }
  if (S) refresh(); else if (LINK) { var c = LINK; LINK = ''; showLink(c); } else showLogin();
  reloadIfNew();
  document.addEventListener('visibilitychange', function () {   // η εφαρμογή ξαναβγαίνει μπροστά
    if (document.visibilityState === 'visible' && Date.now() - VCHK > 60000) reloadIfNew();
  });
})();
</script>
</body>
</html>
